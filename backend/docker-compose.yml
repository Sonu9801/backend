version: '3.8'

services:
  web:
    build: .
    container_name: foxflow_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      
  db:
    image: postgres:15-alpine
    container_name: foxflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Note: Make sure to match the username, password and db with your .env
      POSTGRES_PASSWORD: Skhjp@2000
      POSTGRES_DB: Foxflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

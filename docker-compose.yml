services:
  web:
    build: .
    container_name: foxflow_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./uploads:/app/uploads

  db:
    image: postgres:15-alpine
    container_name: foxflow_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      # Note: Make sure to match the username, password and db with your .env
      - POSTGRES_PASSWORD=Skhjp@2000
      - POSTGRES_DB=Foxflow
      - TZ=Asia/Kolkata
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d Foxflow" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: foxflow_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:


